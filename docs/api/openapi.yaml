openapi: 3.1.0
info:
  title: PowerChain Copilot API
  version: 1.0.0
  description: Authenticated AI operations, renewable intelligence, evidence, analytics and review-first execution API.
servers:
  - url: http://localhost:3002/api/v1
    description: Local backend
security:
  - bearerAuth: []
paths:
  /health:
    get:
      security: []
      operationId: health
      responses: { '200': { description: Process liveness } }
  /ready:
    get:
      security: []
      operationId: ready
      responses:
        '200': { description: Ready }
        '503': { description: Not ready }
  /powerchain/context:
    get:
      operationId: getPowerChainContext
      responses: { '200': { description: Tenant-scoped bootstrap context } }
  /providers/health:
    get:
      operationId: getProviderHealth
      responses: { '200': { description: Sanitized AI provider status } }
  /copilot/conversations:
    get:
      operationId: listConversations
      responses: { '200': { description: Persistent conversation list } }
    post:
      operationId: createConversation
      responses: { '201': { description: Conversation created } }
  /copilot/conversations/{conversationId}/messages:
    get:
      operationId: listConversationMessages
      parameters:
        - in: path
          name: conversationId
          required: true
          schema: { type: string }
      responses: { '200': { description: Ordered message history } }
  /copilot/chat:
    post:
      operationId: createCopilotChatTurn
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                conversationId: { type: string }
                message: { type: string, maxLength: 12000 }
                provider: { type: string }
                model: { type: string }
      responses:
        '200': { description: Evidence-aware Copilot answer }
        '503': { description: AI provider unavailable }
  /documents/parse:
    post:
      operationId: parseEvidenceDocuments
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  maxItems: 3
                  items: { type: string, format: binary }
      responses:
        '200': { description: Parsed document metadata and hashes; extracted text is not returned }
        '413': { description: Size/page boundary exceeded }
  /evidence:
    get:
      operationId: listEvidence
      responses: { '200': { description: Evidence/provenance records } }
  /reports:
    get:
      operationId: listReports
      responses: { '200': { description: Report list } }
    post:
      operationId: createReport
      responses: { '201': { description: Draft report created } }
  /analytics/events:
    post:
      operationId: ingestAnalyticsEvent
      responses: { '202': { description: Bounded content-free analytics event accepted } }
  /analytics/overview:
    get:
      operationId: analyticsOverview
      parameters:
        - in: query
          name: period
          schema: { type: string, enum: [1h, 24h, 7d, 30d], default: 24h }
      responses: { '200': { description: Product/reliability analytics overview } }
  /execution-intents:
    get:
      operationId: listExecutionIntents
      responses: { '200': { description: Reviewable execution intents } }
    post:
      operationId: prepareExecutionIntent
      responses: { '201': { description: Execution intent prepared for review } }
  /execution-intents/{intentId}/approve:
    post:
      operationId: approveExecutionIntent
      parameters:
        - in: path
          name: intentId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Reviewed intent approved and review hash recorded; no wallet signature is created }
        '409': { description: Intent expired or changed }
  /renewables/overview:
    get:
      operationId: renewableOverview
      responses: { '200': { description: Qualified renewable portfolio overview } }
  /solana/balance/{address}:
    get:
      operationId: solanaBalance
      parameters:
        - in: path
          name: address
          required: true
          schema: { type: string }
        - in: query
          name: network
          schema: { type: string, enum: [devnet, mainnet], default: devnet }
      responses: { '200': { description: Chain-verified SOL balance envelope } }
  /solana/assets/{address}:
    get:
      operationId: solanaAssets
      parameters:
        - in: path
          name: address
          required: true
          schema: { type: string }
      responses: { '200': { description: Helius DAS asset response } }
  /solana/jupiter/order:
    post:
      operationId: jupiterOrder
      responses: { '200': { description: Unsigned Jupiter order proposal; must enter execution-intent review before signing } }
  /market/price/{mint}:
    get:
      operationId: birdeyePrice
      parameters:
        - in: path
          name: mint
          required: true
          schema: { type: string }
      responses: { '200': { description: Birdeye market-price envelope } }
  /oracles/pyth/{feedId}:
    get:
      operationId: pythPrice
      parameters:
        - in: path
          name: feedId
          required: true
          schema: { type: string }
      responses: { '200': { description: Pyth oracle price update envelope } }
  /sui/balance/{address}:
    get:
      operationId: suiBalance
      parameters:
        - in: path
          name: address
          required: true
          schema: { type: string }
        - in: query
          name: network
          schema: { type: string, enum: [devnet, testnet, mainnet], default: mainnet }
      responses: { '200': { description: Sui gRPC balance envelope } }
  /copilot/chat/stream:
    post:
      operationId: streamCopilotChat
      description: Streams the structured Copilot lifecycle, including context, generation, verification, evidence, usage, review intents and PWRC credit events.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [message]
              properties:
                conversationId: { type: string }
                message: { type: string, maxLength: 2000 }
                creditClass: { type: string, enum: [CHAT_STANDARD, CHAT_TOOL, ANALYSIS, AGENT_RUN, REPORT], default: CHAT_STANDARD }
      responses:
        '200':
          description: Server-sent event stream
          content:
            text/event-stream:
              schema: { type: string }
        '402': { description: Insufficient PWRC credits }
  /copilot/prompts/library:
    get:
      operationId: getCopilotPromptLibrary
      parameters:
        - in: query
          name: q
          schema: { type: string }
        - in: query
          name: category
          schema: { type: string }
      responses: { '200': { description: Canonical prompt library with credit classes and saved state } }
  /copilot/prompts/saved:
    get:
      operationId: getSavedCopilotPrompts
      responses: { '200': { description: User-scoped saved prompts } }
    post:
      operationId: saveCopilotPrompt
      responses: { '201': { description: Prompt bookmarked } }
  /copilot/prompts/saved/{promptId}:
    delete:
      operationId: deleteSavedCopilotPrompt
      parameters:
        - in: path
          name: promptId
          required: true
          schema: { type: string }
      responses: { '204': { description: Bookmark removed } }
  /copilot/messages/{messageId}/feedback:
    post:
      operationId: submitCopilotMessageFeedback
      parameters:
        - in: path
          name: messageId
          required: true
          schema: { type: string }
      responses: { '200': { description: Evaluation signal persisted against an authenticated assistant message } }
  /copilot/credits/pricing:
    get:
      operationId: getCopilotCreditPricing
      description: Returns the PWRC quote for a Copilot workload class. At the v1.0.0 launch reference, 1 MCU = 10,000 PWRC = $0.02.
      parameters:
        - in: query
          name: class
          schema: { type: string, enum: [CHAT_STANDARD, CHAT_TOOL, ANALYSIS, AGENT_RUN, REPORT], default: CHAT_STANDARD }
        - in: query
          name: mode
          schema: { type: string, enum: [FIXED_PWRC, USD_INDEXED], default: FIXED_PWRC }
        - in: query
          name: priceUsdMicrosPerPwrc
          description: Integer micro-USD price snapshot per PWRC. The launch reference is 2 micro-USD ($0.000002).
          schema: { type: string, pattern: '^[1-9][0-9]*$' }
      responses: { '200': { description: PWRC credit quote } }
  /copilot/credits/balance:
    get:
      operationId: getCopilotCreditBalance
      responses: { '200': { description: Tenant-scoped available and reserved PWRC credit balance } }
  /copilot/credits/ledger:
    get:
      operationId: getCopilotCreditLedger
      parameters:
        - in: query
          name: take
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses: { '200': { description: Immutable PWRC credit ledger entries } }
  /copilot/credits/reservations:
    post:
      operationId: reserveCopilotCredits
      description: Reserves the quoted PWRC amount before Copilot execution.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestId]
              properties:
                requestId: { type: string }
                creditClass: { type: string, enum: [CHAT_STANDARD, CHAT_TOOL, ANALYSIS, AGENT_RUN, REPORT], default: CHAT_STANDARD }
                pricingMode: { type: string, enum: [FIXED_PWRC, USD_INDEXED], default: FIXED_PWRC }
                priceUsdMicrosPerPwrc: { type: string }
      responses:
        '201': { description: PWRC reservation created }
        '402': { description: Insufficient PWRC credits }
  /copilot/credits/reservations/{reservationId}/release:
    post:
      operationId: releaseCopilotCreditReservation
      parameters:
        - in: path
          name: reservationId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Unsettled PWRC reservation returned to available balance }
        '409': { description: Reservation already finalized }
  /copilot/messages/{messageId}/receipt:
    get:
      operationId: getTokenizedMessageReceipt
      description: Returns the privacy-preserving PWRC usage receipt for a settled assistant message. Raw message content is never returned as on-chain metadata.
      parameters:
        - in: path
          name: messageId
          required: true
          schema: { type: string }
      responses:
        '200': { description: Tokenized message usage receipt }
        '404': { description: Receipt not found }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: Clerk session JWT
