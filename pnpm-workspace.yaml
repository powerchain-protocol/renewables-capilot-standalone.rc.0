packages:
  - "apps/*"
  - "packages/*"
  - "programs/*"

strictDepBuilds: true
blockExoticSubdeps: true
minimumReleaseAge: 1440
minimumReleaseAgeExclude:
  - "@web3icons/react@4.1.21"
  - "ai@7.0.68"
  - "@ai-sdk/anthropic@4.0.40"
  - "@ai-sdk/google@4.0.47"
  - "@ai-sdk/deepseek@3.0.29"

allowBuilds:
  "@google/genai": true
  "@prisma/client": true
  "@prisma/engines": true
  prisma: true
  esbuild: true
  sharp: true
  bufferutil: true
  utf-8-validate: true
  bigint-buffer: true
  blake-hash: true
  protobufjs: true
  tiny-secp256k1: true

overrides:
  node-domexception: "link:./vendor/node-domexception"
  "lodash@<4.18.0": "4.18.1"
  "jayson>uuid": "11.1.1"
  "jayson>ws": "7.5.13"
  "utf-8-validate": "5.0.10"
  "deepmerge-ts@<8.0.0": "8.0.1"
  image-size: "npm:image-size-next@2.1.1"
