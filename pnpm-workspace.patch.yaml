# The apply script merges these settings automatically into pnpm-workspace.yaml.
packages:
  - apps/*
  - packages/*
  - programs/*

overrides:
  utf-8-validate: 5.0.10

peerDependencyRules:
  allowedVersions:
    utf-8-validate: ">=5.0.2"

# Keep minimumReleaseAge enabled globally. These exact artifacts are explicitly
# reviewed exceptions for the intentional Next.js 16.3.2 upgrade.
minimumReleaseAgeExclude:
  - "next@16.3.2"
  - "@next/env@16.3.2"
  - "@next/swc-darwin-arm64@16.3.2"
  - "@next/swc-darwin-x64@16.3.2"
  - "@next/swc-linux-arm64-gnu@16.3.2"
  - "@next/swc-linux-arm64-musl@16.3.2"
  - "@next/swc-linux-x64-gnu@16.3.2"
  - "@next/swc-linux-x64-musl@16.3.2"
  - "@next/swc-win32-arm64-msvc@16.3.2"
  - "@next/swc-win32-x64-msvc@16.3.2"
